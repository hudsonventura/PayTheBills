services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paythebills-app
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000;http://+:5173
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/paythebills.db
    volumes:
      - ./data:/app/data

